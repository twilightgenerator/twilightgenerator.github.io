<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#222;--mut:#777;--line:#e6e1d8;--acc:#1f7a4d;--accT:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<script>
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(k==='cls')e.className=v;else if(k==='value')e.value=v;else if(k==='checked')e.checked=v;else e.setAttribute(k,v)}
for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shift=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmt=s=>new Date(s+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});


// ======= CONFIG: paste your Supabase project values here =======
const SUPABASE_URL='https://hfmtpfucdomjjhzmngrm.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_IozUvWj9SaWSylV4qWsMEg_bcdyV5vb';   // the public "anon" key is safe here; row-level security protects the data

// Optional: free OMDb key (omdbapi.com, email only) for better movie matches. Leave blank to use Wikipedia/Wikidata, which needs no key.
const OMDB_KEY='';

// ---------- crypto: one password -> two independent secrets ----------
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbkdf2(pw,saltStr){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(saltStr),iterations:250000,hash:'SHA-256'},k,256))}
async function derive(email,pw){const e=email.trim().toLowerCase();
 const auth=await pbkdf2(pw,'lifelog-auth:'+e),k=await pbkdf2(pw,'lifelog-enc:'+e);
 return{authPw:b64(auth),key:await crypto.subtle.importKey('raw',k,'AES-GCM',false,['encrypt','decrypt'])}}
async function seal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj))));return b64(iv)+'.'+b64(ct)}
async function open(blob){const[i,c]=blob.split('.').map(unb64);
 return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:i},key,c)))}

// ---------- state & sync ----------
let sb,user=null,key=null,D=emptyD(),tab='books',day=today(),lastBlob='',dirty=false,timer=null,poll=null,syncMsg='';
const LS=()=>'lifelog.cache.'+(user&&user.id);
function setStatus(m){syncMsg=m;const e=$('#status');if(e)e.textContent=m}
async function pull(){const{data,error}=await sb.from('vaults').select('blob').eq('user_id',user.id).maybeSingle();
 if(error)throw error;return data?data.blob:null}
async function push(blob){const{error}=await sb.from('vaults').upsert({user_id:user.id,blob,updated_at:new Date().toISOString()});if(error)throw error}
function save(){dirty=true;clearTimeout(timer);setStatus('Saving…');timer=setTimeout(flush,700)}
async function flush(){try{const blob=await seal(D);lastBlob=blob;try{localStorage.setItem(LS(),blob)}catch(e){}
 await push(blob);dirty=false;setStatus('Encrypted & synced')}catch(e){setStatus('Saved on this device — will sync when online')}}
async function refresh(){if(!key||timer)return;if(dirty)return flush();
 try{const b=await pull();if(b&&b!==lastBlob){D=loadD(await open(b));lastBlob=b;try{localStorage.setItem(LS(),b)}catch(e){}render();setStatus('Updated from another device')}}catch(e){}}

// ---------- auth screens ----------
function authScreen(mode,msg){
 const L=$('#lock');L.hidden=false;L.replaceChildren();$('#app').hidden=true;$('#nav').hidden=true;
 if(SUPABASE_URL.startsWith('YOUR_')){L.append(h('h1',{},'Lifelog'),h('p',{},'Setup needed: open this file and paste your Supabase URL and anon key at the top of the script.'));return}
 const up=mode==='up',em=h('input',{type:'email',placeholder:'Email',autocomplete:'email'}),
  p1=h('input',{type:'password',placeholder:'Password',autocomplete:up?'new-password':'current-password'}),
  p2=h('input',{type:'password',placeholder:'Confirm password',autocomplete:'new-password'}),err=h('div',{cls:msg&&msg.ok?'':'err'},msg?msg.t:'');
 const go=async()=>{err.className='err';err.textContent='';const email=em.value.trim();if(!email||!p1.value)return;
  if(up){if(p1.value.length<10){err.textContent='Use at least 10 characters.';return}if(p1.value!==p2.value){err.textContent='Passwords don’t match.';return}}
  btn.disabled=true;btn.textContent='Working…';
  try{const d=await derive(email,p1.value);
   const r=up?await sb.auth.signUp({email,password:d.authPw}):await sb.auth.signInWithPassword({email,password:d.authPw});
   if(r.error)throw r.error;
   if(!r.data.session){authScreen('in',{ok:1,t:'Account created. Check your email to confirm it, then sign in.'});return}
   user=r.data.session.user;key=d.key;await openVault()}
  catch(e){err.textContent=e.message||'Something went wrong.';btn.disabled=false;btn.textContent=up?'Create account':'Sign in'}};
 const btn=h('button',{cls:'b',on:{click:go}},up?'Create account':'Sign in');
 [em,p1,p2].forEach(i=>i.addEventListener('keydown',e=>e.key==='Enter'&&go()));
 L.append(h('h1',{},'Lifelog'),h('p',{},up?'Your password also encrypts your data on this device before it’s uploaded, so it can’t be reset: if you forget it, your data can’t be recovered.':'Sign in to open your encrypted vault.'),
  em,p1,...(up?[p2]:[]),err,h('div',{style:'margin:10px 0'},btn),
  h('a',{on:{click:()=>authScreen(up?'in':'up')}},up?'I already have an account':'Create an account'))}

function unlockScreen(){
 const L=$('#lock');L.hidden=false;L.replaceChildren();$('#app').hidden=true;$('#nav').hidden=true;
 const p=h('input',{type:'password',placeholder:'Password',autocomplete:'current-password'}),err=h('div',{cls:'err'});
 const go=async()=>{err.textContent='';if(!p.value)return;btn.disabled=true;btn.textContent='Unlocking…';
  try{key=(await derive(user.email,p.value)).key;await openVault()}catch(e){key=null;err.textContent='Wrong password.';btn.disabled=false;btn.textContent='Unlock'}};
 const btn=h('button',{cls:'b',on:{click:go}},'Unlock');p.addEventListener('keydown',e=>e.key==='Enter'&&go());
 L.append(h('h1',{},'Lifelog'),h('p',{},'Signed in as '+user.email+'. Enter your password to decrypt your data.'),p,err,h('div',{style:'margin:10px 0'},btn),h('a',{on:{click:signOut}},'Sign out'))}

async function openVault(){
 let blob=null;try{blob=await pull()}catch(e){try{blob=localStorage.getItem(LS())}catch(_){}}
 if(blob){D=loadD(await open(blob));lastBlob=blob}   // throws if wrong password
 else{D=emptyD();save()}
 $('#lock').hidden=true;$('#app').hidden=false;$('#nav').hidden=false;render();setStatus('Encrypted & synced');
 clearInterval(poll);poll=setInterval(refresh,20000)}
function lockVault(){key=null;D=emptyD();clearInterval(poll);unlockScreen()}
async function signOut(){clearInterval(poll);key=null;D=emptyD();try{await sb.auth.signOut()}catch(e){}user=null;authScreen('in')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

// ---------- UI ----------
function emptyD(){return{v:4,books:[],movies:[],albums:[],days:{},projects:[],habits:[],daily:[],backlog:[],inv:{clothes:[],bathroom:[],cables:[],custom:[]}}}
function loadD(o){const ver=(o&&o.v)||0,d=Object.assign(emptyD(),o);d.inv=Object.assign({clothes:[],bathroom:[],cables:[],custom:[]},d.inv);
 d.habits.forEach(x=>{x.done=x.done||{};x.desc=x.desc||{};x.notes=x.notes||[];x.daily=x.daily||[];x.daily.forEach(t=>{t.done=!!t.done;t.att=t.att||[]});x.notes.forEach(n=>{n.att=n.att||[];n.title=n.title||''})});
 [d.inv.bathroom,d.inv.cables,...d.inv.custom.map(c=>c.items)].forEach(l=>l.forEach(x=>{if(x.qty==null)x.qty=1}));
 d.projects.forEach(p=>{p.done=!!p.done});
 for(const k of Object.keys(d.days).sort()){const dy=d.days[k];dy.tasks=dy.tasks||[];
  if(Array.isArray(dy.daily)){dy.dd=dy.dd||[];dy.daily.forEach(t=>{d.daily.push({id:t.id,text:t.text,from:k});if(t.done)dy.dd.push(t.id)});delete dy.daily}}
 if(ver<4){
  d.daily.forEach(t=>{if(t.until&&t.until===shift(t.from,1))delete t.until});
  for(const k of Object.keys(d.days).sort()){const dy=d.days[k];(dy.dd||[]).forEach(id=>{const t=d.daily.find(x=>x.id===id);if(t&&!t.doneOn)t.doneOn=k});delete dy.dd}
  d.v=4}
 return d}
const DAY=()=>D.days[day]||(D.days[day]={tasks:[]});
const LISTS={books:{noun:'book',ph:'author',st:[['reading','reading'],['want','want to read'],['read','read']]},
 movies:{noun:'movie',ph:'year (e.g. 1999)',st:[['watching','watching'],['want','want to watch'],['watched','watched']]},
 albums:{noun:'album',ph:'artist',st:[['listening','listening'],['want','want to listen'],['listened','listened']]}};
const CATS=['bottoms','tops','outerwear','dresses'];
let note='',openP=null,blOpen=false,dlOpen=false,mSub='books',hid=null,hsub='calendar',invTab='clothes',catOpen={},invCat={},noteSel='new',noteEdit=false,draft={title:'',text:'',att:[]};
let hCal={y:new Date().getFullYear(),m:new Date().getMonth(),year:false,sel:null};
const q=encodeURIComponent,pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);

// ---- lookups (no accounts needed) ----
async function jget(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
 try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
const norm=t=>(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const merge=(a,b)=>!a?b:!b?a:{by:a.by||b.by,year:a.year||b.year,img:a.img||b.img};
async function wikiMovie(title,year){
 const w=await jget('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch='+q(title+(year?' '+year:'')+' film')+'&prop=pageimages|pageprops&piprop=thumbnail&pithumbsize=200&ppprop=wikibase_item');
 const pg=Object.values((w.query&&w.query.pages)||{})[0];if(!pg)return null;
 let by='',img=(pg.thumbnail&&pg.thumbnail.source)||'';const id=pg.pageprops&&pg.pageprops.wikibase_item;
 if(!img){try{const r=await jget('https://en.wikipedia.org/api/rest_v1/page/summary/'+q(pg.title.replace(/ /g,'_')));img=(r.thumbnail&&r.thumbnail.source)||''}catch(e){}}
 if(id){try{const e=await jget('https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims&ids='+id);
  const ids=((e.entities[id].claims||{}).P57||[]).map(c=>c.mainsnak.datavalue.value.id);
  if(ids.length){const l=await jget('https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=labels&languages=en&ids='+ids.join('|'));
   by=ids.map(i=>l.entities[i].labels.en&&l.entities[i].labels.en.value).filter(Boolean).join(', ')}}catch(e){}}
 return{by,year:((pg.title.match(/\((\d{4}) film\)/)||[])[1])||'',img}}
async function itunesMovie(title,year){
 const l=((await jget('https://itunes.apple.com/search?media=movie&entity=movie&limit=15&term='+q(title))).results||[]).filter(x=>norm(x.trackName)===norm(title));
 const m=(year&&l.find(x=>(x.releaseDate||'').startsWith(year)))||l[0];if(!m)return null;
 return{by:m.artistName||'',year:(m.releaseDate||'').slice(0,4),img:(m.artworkUrl100||'').replace('100x100bb','200x300bb')}}
async function lookupMovie(title,year){let r=null;
 if(OMDB_KEY){try{const o=await jget('https://www.omdbapi.com/?apikey='+OMDB_KEY+'&t='+q(title)+(year?'&y='+q(year):''));
  if(o.Response==='True')r={by:o.Director!=='N/A'?o.Director:'',year:(o.Year||'').slice(0,4),img:o.Poster&&o.Poster!=='N/A'?o.Poster:''}}catch(e){}}
 if(r&&r.img&&r.by)return r;
 try{r=merge(r,await wikiMovie(title,year))}catch(e){}
 if(!r||!r.img||!r.by){try{r=merge(r,await itunesMovie(title,year))}catch(e){}}
 return r}
async function lookupBook(title,author){
 const d=(await jget('https://openlibrary.org/search.json?limit=1&fields=author_name,first_publish_year,cover_i&title='+q(title)+(author?'&author='+q(author):''))).docs[0];
 if(!d)return null;return{by:(d.author_name||[])[0]||'',year:d.first_publish_year||'',img:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':''}}

async function lookupAlbum(title,artist){
 const c=t=>t.replace(/"/g,''),r=await jget('https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=1&query='+q('releasegroup:"'+c(title)+'"'+(artist?' AND artist:"'+c(artist)+'"':'')));
 const g=(r['release-groups']||[])[0];if(!g)return null;
 return{by:(g['artist-credit']&&g['artist-credit'][0]&&g['artist-credit'][0].name)||'',year:(g['first-release-date']||'').slice(0,4),img:'https://coverartarchive.org/release-group/'+g.id+'/front-250'}}

// ---- encrypted file storage (files are encrypted in the browser before upload) ----
async function sealBytes(u8){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8));
 const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function openBytes(u8){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},key,u8.slice(12))}
async function imgThumb(file,s){s=s||96;const bm=await createImageBitmap(file),c=document.createElement('canvas');c.width=c.height=s;
 const r=Math.max(s/bm.width,s/bm.height),w=bm.width*r,hh=bm.height*r;c.getContext('2d').drawImage(bm,(s-w)/2,(s-hh)/2,w,hh);return c.toDataURL('image/jpeg',.6)}
function loadPdfjs(){return window.pdfjsLib?Promise.resolve(window.pdfjsLib):new Promise((res,rej)=>{const sc=document.createElement('script');
 sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};sc.onerror=rej;document.head.append(sc)})}
async function pdfThumb(u8){const lib=await loadPdfjs(),doc=await lib.getDocument({data:u8.slice()}).promise,pg=await doc.getPage(1),v0=pg.getViewport({scale:1}),
 vp=pg.getViewport({scale:168/v0.width}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',.6)}
